[project]
name = "money-utils"
version = "0.1.0"
description = ""
authors = [
  "Soeren Wegener <wegener92@gmail.com>",
  "Jonas Thelemann <e-mail@jonas-thelemann.de>",
  "Claus F. Strasburger <1156864+cfstras@users.noreply.github.com>"
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bokeh>=3,<4",
  # NOTE: django-cron 0.6.0 (last release, unmaintained) is incompatible with
  # Django >= 5.1; a patched copy is vendored in ./django_cron instead.
  "django>=6.1.2,<7",
  "fints==5.0.1",
  "fuzzywuzzy==0.18.0",
  "mt-940>=5.1.1,<6",
  "pandas==3.1.0",
  "sqlalchemy==2.1.6",
  "uwsgi==2.0.31",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-django>=4.8,<5",
]

[tool.pytest.ini_options]
# No DJANGO_SETTINGS_MODULE here: pytest-django would then initialize Django
# during its preparse hook, before the root conftest.py has loaded the
# machine-local ``config`` module (see conftest.py). The conftest sets
# DJANGO_SETTINGS_MODULE and calls django.setup() itself.
django_find_project = false
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "report", "bank"]
