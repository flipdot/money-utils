name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - master
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: dargmuesli/github-actions/.github/workflows/ci-optimization.yml@69154c1ca2c2bc78ee9fa87f3ac206243aaf85ff # 5.9.10
    permissions:
      pull-requests: read
  build:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Build
    uses: dargmuesli/github-actions/.github/workflows/docker.yml@69154c1ca2c2bc78ee9fa87f3ac206243aaf85ff # 5.9.10
    permissions:
      packages: write
    with:
      PUSH: false
  test:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"

      # Fails if uv.lock is out of date, and installs the dev group (pytest).
      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile all modules
        run: uv run python -m compileall -q . -x '.git|.venv|static|data'

      - name: Run tests
        run: uv run pytest -v
